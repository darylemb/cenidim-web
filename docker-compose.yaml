# Default stack — Phase 9 (Go backend retired).
#
# The only backend is FastAPI / Python. The Go / Gin service and its
# rollback compose were removed (see docs/CUTOVER.md Phase 9). The
# db-init sidecar is a single Python+spaCy stage (docker/db-init.Dockerfile).
#
# Frontend is unchanged: nginx proxies /api/* to the backend on 8000.

services:
  # db-init regenerates letras.db from CSV + LetrasTXT + the classifier.
  # It is a single Python+spaCy stage (build → classify → normalize).
  db-init:
    build:
      context: .
      dockerfile: docker/db-init.Dockerfile
      args:
        - ADMIN_PASS=admin123
    environment:
      - ADMIN_PASS=admin123
    volumes:
      - ./data:/data
      - ./LetrasTXT:/app/LetrasTXT:ro
      - ./db_fonografia.csv:/app/db_fonografia.csv:ro
    restart: "no"

  backend:
    image: cenidim-backend:latest
    # FastAPI / Pydantic v2 implementation. See backend-fastapi/Dockerfile
    # for the multi-stage build (uv-managed deps, non-root runtime).
    build:
      context: .
      dockerfile: backend-fastapi/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Core
      - CENIDIM_DB_PATH=/data/letras.db
      - CENIDIM_JWT_SECRET=cenidim-dev-secret-2024
      - CENIDIM_ENV=dev

      # Structured logging (json default; set to "text" for human-readable).
      - CENIDIM_LOG_FORMAT=json

      # Resend — leave blank to use the dev outbox path. The outbox
      # is exposed at /api/admin/emails so operators can inspect
      # sends in development.
      - RESEND_API_KEY=
      - CENIDIM_EMAIL_FROM=no-reply@cenidim.local
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Apply any pending Alembic migrations, then start uvicorn. The
    # dev schema-bootstrap (which creates the tables from scratch when
    # the DB is empty) still runs as a fallback so a brand-new
    # ``letras.db`` produced by the db-init sidecar continues to work
    # even without an alembic_version row.
    command:
      - sh
      - -c
      - /entrypoint.sh
    depends_on:
      db-init:
        condition: service_completed_successfully

  frontend:
    image: cenidim-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - CENIDIM_BACKEND_HOST=backend
    ports:
      - "80:8080"
    restart: unless-stopped
    depends_on:
      - backend