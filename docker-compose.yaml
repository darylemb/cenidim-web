services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - ADMIN_PASS=admin123
    ports:
      - "8000:8080" # Map host 8000 to internal Go 8080
    environment:
      - DB_PATH=/data/letras.db
      - JWT_SECRET=cenidim-dev-secret-2024
      - GIN_MODE=release
    volumes:
      - ./backend/data:/data
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    restart: unless-stopped
    depends_on:
      - backend
