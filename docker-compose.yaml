services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - ADMIN_PASS
    ports:
      - "8000:8080" # Map host 8000 to internal Go 8080
    environment:
      - DB_PATH=/app/letras.db
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    restart: unless-stopped
    depends_on:
      - backend
