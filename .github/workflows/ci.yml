name: Continuous Integration

on:
  push:
    branches: [ "main", "dev", "feat*/*" ]
  pull_request:
    branches: [ "main", "dev"]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --run

  backend-go-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
          cache-dependency-path: backend/go.sum
      - run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.61
      - run: golangci-lint run
      - run: go test -v ./...

  fastapi-checks:
    name: FastAPI backend (lint + test + drift guard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-fastapi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install deps
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check app/ tests/
      - name: Pytest
        run: PYTHONPATH=. uv run pytest tests/ -v
      - name: OpenAPI drift guard
        run: uv run python scripts/generate_openapi.py && git diff --exit-code -- openapi.json
      - name: Smoke script syntax check
        run: bash -n scripts/smoke.sh

  docker-build:
    # Phase 7 cut-over: docker-compose.yaml now points at the
    # FastAPI backend. This job builds + boots the default stack
    # and runs the smoke script against /healthz + /metrics.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker images (default compose = FastAPI)
        run: docker compose build
      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y trivy
      - name: Run Trivy vulnerability scanner
        run: |
          trivy image --severity HIGH,CRITICAL --exit-code 1 --no-progress cenidim-backend:latest || true
          trivy image --severity HIGH,CRITICAL --exit-code 1 --no-progress cenidim-frontend:latest || true
      - name: Run Trivy filesystem scan
        run: |
          trivy config --severity HIGH,CRITICAL . || true
      - name: Upload Trivy results as artifact
        if: always()
        run: |
          trivy image --format sarif --output trivy-results.sarif --severity HIGH,CRITICAL --no-progress cenidim-backend:latest || true
          trivy image --format sarif --output frontend-trivy-results.sarif --severity HIGH,CRITICAL --no-progress cenidim-frontend:latest || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: |
            trivy-results.sarif
            frontend-trivy-results.sarif
          retention-days: 30
      - name: Start services
        run: docker compose up -d
      - name: Health check
        run: sleep 45 && curl -sf http://localhost:8000/healthz
      - name: Debug: dump backend-fastapi logs
        run: docker compose -f docker-compose-fastapi.yaml logs backend-fastapi | tail -200
      - name: Smoke script
        run: |
          chmod +x backend-fastapi/scripts/smoke.sh
          backend-fastapi/scripts/smoke.sh http://localhost:8000
      - name: Stop services
        if: always()
        run: docker compose down

  docker-build-fastapi:
    name: FastAPI docker compose overlay smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build + boot the FastAPI overlay stack
        run: docker compose -f docker-compose-fastapi.yaml up -d --build
      - name: Health check
        run: sleep 45 && curl -sf http://localhost:8000/healthz
      - name: Smoke script
        run: |
          chmod +x backend-fastapi/scripts/smoke.sh
          backend-fastapi/scripts/smoke.sh http://localhost:8000
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-fastapi.yaml down

  docker-build-go-rollback:
    # Verifies the rollback compose file still works, so operators
    # can flip back if the FastAPI cut-over misbehaves.
    name: Go docker compose rollback smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build + boot the Go rollback stack
        run: docker compose -f docker-compose-go.yaml up -d --build
      - name: Health check
        run: sleep 15 && curl -sf http://localhost:8000/health
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-go.yaml down