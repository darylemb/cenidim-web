<!DOCTYPE html>
<html lang="en">
<script>
function filterTable() {
  String.prototype.localeContains = function(sub) {
    if(sub==="") return true;
    if(!sub || !this.length) return false;
    sub = ""+sub;
    if(sub.length>this.length) return false;
    let ascii = s => s.normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    return ascii(this).includes(ascii(sub));
  }
  
  const input = document.getElementById("myInput");
  const field = document.getElementById("myField");
  var filter, table, tr, td, i, j, txtValue, minLen;
  
  minLen = 3;
  
  if (input.value.length >= minLen){
    filter = input.value.toUpperCase();
    table = document.getElementById("myTable");
    tr = table.getElementsByTagName("tr");
    
    for (i = 0; i < tr.length; i++) {
      td = tr[i].getElementsByTagName("td");
      
      if (td.length > 0){
        if (field.value == "author"){
          j = 2;
        }else if(field.value == "year"){
          j = 1;
        }else if (field.value == "title"){
          j = 3;
        }else if(field.value == "track"){
          j = 4;
        }else{
          j = -1;
        }
        
        if (j == -1){
          for (j = 1; j < td.length-2; j++) {
            txtValue = td[j].textContent || td[j].innerText;
            //if (txtValue.toUpperCase().indexOf(filter) > -1) {
            if (txtValue.localeContains(filter)) {
              tr[i].style.display = "";
              break;
            } else {
              tr[i].style.display = "none";
            }
          }
        }else{
          txtValue = td[j].textContent || td[j].innerText;
          //if (txtValue.toUpperCase().indexOf(filter) > -1) {
          if (txtValue.localeContains(filter)) {
            tr[i].style.display = "";
          } else {
            tr[i].style.display = "none";
          }
        }
      }
    }
  }else{
    if (field.value == "author"){
      hideTable();
    }else if(field.value == "year"){
      hideTable();
    }else if(field.value == "title"){
      hideTable();
    }else if(field.value == "track"){
      hideTable();
    }else{
      showTable();
    }
  }
}

function resetSearch(){
  var input, field;
  field = document.getElementById("myField");
  input = document.getElementById("myInput");
  
  input.value = ""
  if (field.value == "author"){
    input.placeholder="Buscar por intérprete..."
  }else if(field.value == "year"){
    input.placeholder="Buscar por año..."
  }else if(field.value == "title"){
    input.placeholder="Buscar por título..."
  }else if(field.value == "track"){
    input.placeholder="Buscar por pista..."
  }else{
    input.placeholder="Buscar..."
  }
  
  showTable();
}

function showTrack(path){
  var fetchedtext;
  
  Promise.all([
  fetch(path).then(x => x.text())
  ]).then(([fetchedtext]) => {
    const trackdiv = document.getElementById("letra");
    trackdiv.style.display = "block";
    //console.log(fetchedtext);
    fetchedtext = fetchedtext.replace(/(?:\r\n|\r|\n)/g, '<br>');
    trackdiv.innerHTML = fetchedtext;
  });
  const trackbutton = document.getElementById("letrabutton");
  trackbutton.style.display = "block";
}

function hideTrack(){
  const trackdiv = document.getElementById("letra");
  trackdiv.style.display = "none";
  //console.log(fetchedtext);
  trackdiv.innerHTML = "";
  const trackbutton = document.getElementById("letrabutton");
  trackbutton.style.display = "none";
}

function includeHTML() {
  var z, i, elmnt, file, xhttp;
  /* Loop through a collection of all HTML elements: */
  z = document.getElementsByTagName("*");
  for (i = 0; i < z.length; i++) {
    elmnt = z[i];
    /*search for elements with a certain atrribute:*/
    file = elmnt.getAttribute("w3-include-html");
    if (file) {
      /* Make an HTTP request using the attribute value as the file name: */
      xhttp = new XMLHttpRequest();
      xhttp.onreadystatechange = function() {
        if (this.readyState == 4) {
          if (this.status == 200) {elmnt.innerHTML = this.responseText;}
          if (this.status == 404) {elmnt.innerHTML = "Page not found.";}
          /* Remove the attribute, and call this function once more: */
          elmnt.removeAttribute("w3-include-html");
          includeHTML();
        }
      }
      xhttp.open("GET", file, true);
      xhttp.send();
      /* Exit the function: */
      return;
    }
  }
}

function hideTable() {
  var table, tr, tbody, i;
  table = document.getElementById("myTable");
  tbody = table.getElementsByTagName("tbody");
  tr = tbody[0].getElementsByTagName("tr");
  
  for (i = 0; i < tr.length; i++) {
    tr[i].style.display = "none";
  }
}

function showTable() {
  var table, tr, i;
  table = document.getElementById("myTable");
  tr = table.getElementsByTagName("tr");
  
  for (i = 0; i < tr.length; i++) {
    tr[i].style.display = "";
  }
}

document.onkeydown = function(evt) {
    evt = evt || window.event;
    var isEscape = false;
    if ("key" in evt) {
        isEscape = (evt.key === "Escape" || evt.key === "Esc");
    } else {
        isEscape = (evt.keyCode === 27);
    }
    if (isEscape) {
        resetSearch();
    }
};

</script>

<head>

      bottom: 388px;    /* 10px from the bottom of the viewport */

</head>
<body>

<h2>Línea de Tiempo</h2>

<button type="button" onclick="resetSearch()">Reset</button>
&nbsp;&nbsp;&nbsp;&nbsp;
<select name="field" id="myField" onchange="resetSearch();" selected="author">
  <option value="author">Interprete</option>
  <option value="year">Año</option>
  <option value="title">Título</option>
  <option value="track">Pista</option>
</select>
<input type="text" id="myInput" onkeyup="filterTable()" placeholder="Buscar por intérprete...">

<script>
includeHTML();
</script>

<div id="letra">
  
</div>

  <button onclick="hideTrack()">X</button>
</div>

</body>
</html>
