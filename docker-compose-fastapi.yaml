# Phase 1 docker-compose overlay for the FastAPI backend.
#
# Usage:
#   docker compose -f docker-compose-fastapi.yaml up --build
#
# This file mirrors docker-compose.yaml so the FastAPI backend can
# run side-by-side (or as a drop-in replacement) for development
# without touching the existing Go stack. Phase 7 of the master plan
# folds this into docker-compose.yaml as the single backend service.

services:
  # The Python build still depends on db-init producing letras.db so
  # both stacks see the same catalog during the cutover.
  db-init:
    build:
      context: .
      dockerfile: backend/Dockerfile.init
      args:
        - ADMIN_PASS=admin123
    environment:
      - ADMIN_PASS=admin123
    volumes:
      - ./backend/data:/data
      - ./LetrasTXT:/app/LetrasTXT:ro
      - ./db_fonografia.csv:/app/db_fonografia.csv:ro
    restart: "no"

  backend-fastapi:
    build:
      context: .
      dockerfile: backend-fastapi/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Core (FastAPI uses CENIDIM_-prefixed env vars via pydantic)
      - CENIDIM_DB_PATH=/data/letras.db
      - CENIDIM_JWT_SECRET=cenidim-dev-secret-2024
      - CENIDIM_ENV=dev
      - CENIDIM_LOG_FORMAT=json

      # Google OAuth — same shape as the production compose.
      - GOOGLE_CLIENT_ID=
      - GOOGLE_CLIENT_SECRET=
      - GOOGLE_REDIRECT_URL=http://localhost:8000/api/auth/google/callback
      - FRONTEND_BASE_URL=http://localhost

      # Resend.
      - RESEND_API_KEY=
      - CENIDIM_EMAIL_FROM=no-reply@cenidim.local
    volumes:
      - ./backend/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    # Apply pending Alembic migrations, then start uvicorn. The
    # \`|| true\` fallback keeps the container up when alembic returns
    # 0 (no pending migrations) so the operator's existing flow stays
    # intact.
    command:
      - sh
      - -c
      - |
        .venv/bin/alembic upgrade head || true
        exec .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:8080"
    restart: unless-stopped
    depends_on:
      - backend-fastapi
