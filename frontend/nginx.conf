server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        # The backend hostname is substituted at container start by
        # /docker-entrypoint.d/30-subst-backend-host.sh, which reads
        # $CENIDIM_BACKEND_HOST and rewrites this line. Both
        # docker-compose files set CENIDIM_BACKEND_HOST so the same
        # image works with the default stack and the FastAPI overlay.
        proxy_pass http://${CENIDIM_BACKEND_HOST}:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}