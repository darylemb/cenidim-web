services:
  db-init:
    build:
      context: .
      dockerfile: backend/Dockerfile.init
      args:
        - ADMIN_PASS
    environment:
      - DB_PATH=/data/letras.db
    volumes:
      - cenidim_db:/data
    restart: "no"
    # db-init is a one-shot seed: it runs the Go db-builder + spaCy
    # classifier, then exits 0. We want compose to treat a clean
    # exit as success so the backend can start. The healthcheck
    # below is a no-op that always reports healthy — Coolify only
    # checks restart policy + exit code for one-shot services, so
    # the real signal is `depends_on: service_completed_successfully`
    # on the backend.
    healthcheck:
      test:
        - CMD-SHELL
        - "true"
      interval: 5s
      timeout: 1s
      retries: 1
    networks:
      - app-internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - ADMIN_PASS
        - JWT_SECRET
    expose:
      - '8080'
    environment:
      # /data is backed by the named volume below. db-init writes
      # letras.db here on first boot; the backend reads from it
      # thereafter.
      - DB_PATH=/data/letras.db
      - GIN_MODE=release
      # Google OAuth — see README "Google sign-in (production)".
      # GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are loaded from
      # Coolify's secret store; the redirect + frontend URLs are
      # hard-coded here because they're tied to the public domain.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL:-https://cenidim.example.com/api/auth/google/callback}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-https://cenidim.example.com}
      # Comma-separated allowlist for Google users that should be
      # promoted to admin on sign-in.
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
    volumes:
      - cenidim_db:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - ./healthcheck
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - app-internal

  frontend:
    container_name: cenidim-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - '8080'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:8080/
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-internal
      - public-network

networks:
  app-internal:
    driver: bridge
  public-network:
    external: true

volumes:
  cenidim_db:
