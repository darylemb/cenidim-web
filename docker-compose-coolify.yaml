services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - ADMIN_PASS
    environment:
      - DB_PATH=/app/letras.db
      - JWT_SECRET=${JWT_SECRET}
      - GIN_MODE=release
    restart: unless-stopped
    healthcheck:
      test: ['CMD', './healthcheck']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
