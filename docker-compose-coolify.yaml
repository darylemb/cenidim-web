# Coolify production stack — Phase 7 cut-over.
#
# Same shape as ``docker-compose.yaml`` but with Coolify-friendly
# conventions (named volume, no host port for the backend, secret
# placeholders resolved by Coolify's env store, ``app-internal``
# bridge + ``public-network``).
#
# Rollback is documented in docs/CUTOVER.md.

services:
  db-init:
    build:
      context: .
      dockerfile: backend/Dockerfile.init
      args:
        - ADMIN_PASS
    environment:
      - DB_PATH=/data/letras.db
    volumes:
      - cenidim_db:/data
    restart: "no"
    healthcheck:
      test:
        - CMD-SHELL
        - "true"
      interval: 5s
      timeout: 1s
      retries: 1
    networks:
      - app-internal

  backend:
    build:
      context: .
      dockerfile: backend-fastapi/Dockerfile
    expose:
      - '8000'
    environment:
      # /data is backed by the named volume below. db-init writes
      # letras.db here on first boot; the backend runs
      # ``alembic upgrade head`` against it on first boot too.
      - CENIDIM_DB_PATH=/data/letras.db
      - CENIDIM_JWT_SECRET=${JWT_SECRET}
      - CENIDIM_ENV=prod
      - CENIDIM_LOG_FORMAT=json
      - CENIDIM_WORKERS=${CENIDIM_WORKERS:-2}

      # Google OAuth — see docs/CUTOVER.md. The dashboard login
      # page hides the Google button in Phase 7; admins can still
      # wire their own keys for SSO use.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL:-https://cenidim.example.com/api/auth/google/callback}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-https://cenidim.example.com}

      # Resend — leave blank to use the dev outbox path.
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - CENIDIM_EMAIL_FROM=${CENIDIM_EMAIL_FROM:-no-reply@cenidim.example.com}
    volumes:
      - cenidim_db:/data
    restart: unless-stopped
    # Apply pending Alembic migrations before uvicorn starts. The
    # fallback ``|| true`` keeps the container up even when the DB is
    # already at head (alembic returns 0 but the pipe-friendly behaviour
    # avoids spurious errors during the boot).
    command:
      - sh
      - -c
      - |
        .venv/bin/alembic upgrade head || true
        exec .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers $${CENIDIM_WORKERS:-2}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - app-internal

  frontend:
    container_name: cenidim-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - '8080'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:8080/
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-internal
      - public-network

networks:
  app-internal:
    driver: bridge
  public-network:
    external: true

volumes:
  cenidim_db: