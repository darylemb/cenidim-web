services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - ADMIN_PASS
        - JWT_SECRET
    expose:
      - '8080'
    environment:
      - DB_PATH=/app/letras.db
      - GIN_MODE=release
      # Google OAuth — see README "Google sign-in (production)".
      # GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are loaded from
      # Coolify's secret store; the redirect + frontend URLs are
      # hard-coded here because they're tied to the public domain.
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL:-https://cenidim.example.com/api/auth/google/callback}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-https://cenidim.example.com}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - ./healthcheck
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - app-internal

  frontend:
    container_name: cenidim-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - '8080'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://localhost:8080/
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-internal
      - public-network

networks:
  app-internal:
    driver: bridge
  public-network:
    external: true
