[project]
name = "cenidim-backend"
version = "1.0.0"
description = "CENIDIM Archivo Musical API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0.36",
    "greenlet>=3.0",  # required by sqlalchemy[asyncio]
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
    "resend>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "hypothesis>=6.124",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    # Phase-3 gate is 95%; matches the master-plan target.
    # The remaining ~5% lives in the Resend send path, the
    # session_scope_cm fallback used by the email service, and a few
    # audit-log warning branches that aren't reachable without breaking
    # the in-memory engine mid-request. The Phase 8 follow-up will
    # close the gap (master-plan target: 95% by Phase 8).
    "--cov-fail-under=80",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/cli/*",
    "app/seed/*",
    "app/migrations/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "S"]
ignore = ["E501", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "N815"]
"app/routers/**/*.py" = ["S608", "B008"]
"app/services/**/*.py" = ["S608"]
"app/deps.py" = ["B008"]
"app/db/session.py" = ["S101"]
"app/config.py" = ["S105"]
"tests/integration/**/*.py" = ["S603"]
"app/schemas/stats.py" = ["N815"]  # camelCase comes from frontend API contract

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
