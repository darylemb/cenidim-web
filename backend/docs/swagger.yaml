basePath: /api
definitions:
  handlers.AlbumCount:
    properties:
      album:
        type: string
      count:
        type: integer
      year:
        type: string
    type: object
  handlers.StatsResponse:
    properties:
      avg_lyrics_length:
        type: number
      distinct_themes:
        type: integer
      recently_added:
        type: integer
      songs_by_clasificacion:
        additionalProperties:
          type: integer
        type: object
      songs_by_indigena:
        additionalProperties:
          type: integer
        type: object
      songs_by_oov_level:
        additionalProperties:
          type: integer
        type: object
      songs_by_theme:
        additionalProperties:
          type: integer
        type: object
      songs_by_year:
        additionalProperties:
          type: integer
        type: object
      songs_with_lyrics:
        type: integer
      songs_without_year:
        type: integer
      top_albums:
        items:
          $ref: '#/definitions/handlers.AlbumCount'
        type: array
      total_albums:
        type: integer
      total_songs:
        type: integer
    type: object
  handlers.WordCloudResponse:
    properties:
      excludedStopWords:
        type: integer
      totalWords:
        type: integer
      words:
        items:
          $ref: '#/definitions/handlers.WordFreq'
        type: array
    type: object
  handlers.WordFreq:
    properties:
      size:
        type: integer
      text:
        type: string
    type: object
  models.LoginInput:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.Song:
    properties:
      album:
        description: All fonograma columns (joined)
        type: string
      ciudad_edicion:
        type: string
      clasificacion:
        type: string
      editora:
        type: string
      filename:
        type: string
      fonograma_id:
        type: integer
      id:
        type: integer
      interprete_participante:
        type: string
      interprete_principal:
        type: string
      interpretes_invitados:
        type: string
      numero_catalogo:
        type: string
      observaciones:
        type: string
      pais_edicion:
        type: string
      pistas:
        type: string
      soporte_fisico:
        type: string
      subtitulo:
        type: string
      tema:
        type: string
      title:
        type: string
      version:
        type: integer
      year:
        type: string
    type: object
  models.SongDetail:
    properties:
      album:
        description: All fonograma columns (joined)
        type: string
      ciudad_edicion:
        type: string
      clasificacion:
        type: string
      editora:
        type: string
      filename:
        type: string
      fonograma_id:
        type: integer
      id:
        type: integer
      interprete_participante:
        type: string
      interprete_principal:
        type: string
      interpretes_invitados:
        type: string
      lyrics:
        type: string
      numero_catalogo:
        type: string
      observaciones:
        type: string
      pais_edicion:
        type: string
      pistas:
        type: string
      soporte_fisico:
        type: string
      subtitulo:
        type: string
      tema:
        type: string
      title:
        type: string
      version:
        type: integer
      year:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      role:
        type: string
      username:
        type: string
      version:
        type: integer
    type: object
  models.UserInput:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      role:
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a sample server for Cenidim songs.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Cenidim Songs API
  version: "1.0"
paths:
  /admin/users/{id}/identity:
    delete:
      description: |-
        Removes the user_identities row(s) for the given user so that
        future Google sign-ins with that Google account will not
        match this user.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Unlink a Google identity from a user
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration data
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.UserInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /search:
    get:
      consumes:
      - application/json
      description: |-
        Search songs by title, album, or lyrics with pagination. Honors
        the shared filter parameters: theme, year_from, year_to,
        clasificacion, album, q.
      parameters:
      - description: Search query (deprecated alias for q)
        in: query
        name: query
        type: string
      - description: Search query
        in: query
        name: q
        type: string
      - description: Field to search in (title, album, lyrics, all)
        in: query
        name: field
        type: string
      - description: Comma-separated theme list; use __none__ for unclassified
        in: query
        name: theme
        type: string
      - description: Inclusive lower bound on year
        in: query
        name: year_from
        type: integer
      - description: Inclusive upper bound on year
        in: query
        name: year_to
        type: integer
      - description: Filter by clasificacion (ESPAÑOL_ESTANDAR, ESPAÑOL_REGIONAL,
          LENGUA_INDIGENA)
        in: query
        name: clasificacion
        type: string
      - description: Exact album match
        in: query
        name: album
        type: string
      - description: Sort field (id, clave, title, album, year, filename, clasificacion)
        in: query
        name: order_by
        type: string
      - description: Sort direction (asc, desc)
        in: query
        name: order_dir
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Search songs
      tags:
      - songs
  /song/{song_id}:
    get:
      consumes:
      - application/json
      description: Get detailed information about a song by ID
      parameters:
      - description: Song ID
        in: path
        name: song_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SongDetail'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get song detail
      tags:
      - songs
  /stats:
    get:
      consumes:
      - application/json
      description: |-
        Returns aggregate metrics for the dashboard. Honors the
        shared filter query parameters: theme, year_from, year_to,
        clasificacion, album, q.
      parameters:
      - description: Comma-separated theme list; use __none__ for unclassified
        in: query
        name: theme
        type: string
      - description: Inclusive lower bound on year
        in: query
        name: year_from
        type: integer
      - description: Inclusive upper bound on year
        in: query
        name: year_to
        type: integer
      - description: Comma-separated classification list
        in: query
        name: clasificacion
        type: string
      - description: Exact album match
        in: query
        name: album
        type: string
      - description: Free-text search across title, lyrics, and album
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.StatsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get database statistics
      tags:
      - stats
  /timeline:
    get:
      consumes:
      - application/json
      description: |-
        Get songs grouped by year for the timeline view. Honors the
        shared filter parameters: theme, year_from, year_to,
        clasificacion, album, q. Songs without a year (s/d) are
        grouped under the literal key "s/d" in the response; when a
        year range is supplied, the s/d bucket is omitted.
      parameters:
      - description: Comma-separated theme list; use __none__ for unclassified
        in: query
        name: theme
        type: string
      - description: Inclusive lower bound on year
        in: query
        name: year_from
        type: integer
      - description: Inclusive upper bound on year
        in: query
        name: year_to
        type: integer
      - description: Comma-separated classification list
        in: query
        name: clasificacion
        type: string
      - description: Exact album match
        in: query
        name: album
        type: string
      - description: Free-text search across title, lyrics, and album
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/models.Song'
              type: array
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get songs timeline
      tags:
      - songs
  /word-cloud:
    get:
      description: Returns word frequencies from song lyrics excluding stop words
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.WordCloudResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get word frequency data for word cloud
      tags:
      - stats
swagger: "2.0"
