# Alembic configuration for the FastAPI backend.
#
# The CLI picks up the database URL from ``DATABASE_URL`` (or
# ``CENIDIM_DB_PATH``) via ``alembic/env.py``. Keeping the URL out of
# this file means we don't leak secrets to source control and the
# same config drives Docker, CI, and local dev.

[alembic]
# Path to the migration scripts directory (relative to this file).
script_location = alembic

# Revision file template. Use a timestamp + slug so the order is
# obvious in ``alembic history``.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Search path for ``alembic`` upgrades inside docker containers.
prepend_sys_path = .

# The URL is set programmatically by env.py via app.config.Settings,
# so the placeholder below is never read at runtime.
sqlalchemy.url = sqlite:///letras.db

# Timezone for the timestamp in the revision file. UTC keeps the
# generated filenames deterministic across containers.
timezone = UTC

# Truncate long migration descriptions.
truncate_slug_length = 40

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S